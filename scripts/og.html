<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Geist";src:url("../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2");font-weight:100 900}
:root{--ink:oklch(0.145 0 0);--mute:oklch(0.556 0 0);--rule:oklch(0.88 0 0);--green:oklch(0.52 0.15 155)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#fff;color:var(--ink);position:relative;overflow:hidden;font-family:"Noto Sans CJK JP",sans-serif}
.top{position:absolute;left:80px;right:80px;top:60px;height:40px;display:flex;justify-content:space-between;align-items:center;font:500 20px/1 "Geist";letter-spacing:.14em;color:var(--mute);border-bottom:1px solid var(--rule);padding-bottom:22px;height:44px}
.top span:last-child{font-family:"Noto Sans CJK JP";letter-spacing:.08em;font-size:19px}
.grid{position:absolute;left:80px;top:134px;width:1040px}
.row{display:grid;grid-template-columns:repeat(10,104px);height:116px;align-items:center}
.row b{font-weight:400;text-align:center;display:block}
.a b{font:600 84px/1 "Noto Serif CJK JP",serif}
.b b{font:400 84px/1 "Noto Serif CJK JP",serif;color:oklch(0.82 0 0)}
.b b.m{color:var(--green);font-weight:600}
.lab{position:absolute;left:0;font:500 15px/1 "Noto Sans CJK JP";letter-spacing:.12em;color:var(--mute)}
.hr{height:1px;background:var(--rule)}
.hr.g{background:var(--green);height:2px;width:312px}
.title{position:absolute;left:80px;top:424px;font:700 62px/1 "Noto Serif CJK JP",serif;letter-spacing:.02em}
.sub{position:absolute;left:80px;top:512px;font:400 24px/1.5 "Noto Sans CJK JP";color:var(--mute);letter-spacing:.03em}
.cnt{position:absolute;right:80px;top:521px;font:500 20px/1 "Geist";letter-spacing:.1em;color:var(--green)}
</style></head><body>
<div class="top"><span>IMT.LAPIUS7.COM</span><span>1 秒に 1 文字</span></div>
<div class="grid">
  <div class="row a"><b>め</b><b>ろ</b><b>す</b><b>は</b><b>け</b><b>き</b><b>と</b><b>し</b><b>た</b><b>。</b></div>
  <div class="hr"></div>
  <div class="row b"><b class="m">め</b><b class="m">ろ</b><b class="m">す</b><b>ぬ</b><b>ふ</b><b>ひ</b><b>え</b><b>ま</b><b>ゆ</b><b>れ</b></div>
  <div class="hr g"></div>
</div>
<div class="title">無限の猿定理シミュレータ</div>
<div class="sub">『走れメロス』の全文一致を、ランダムなひらがなで待つ</div>
<div class="cnt">10,685 CHARS</div>
</body></html>
